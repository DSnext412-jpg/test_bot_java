# Server configuration
server.port=8080

# MySQL Database configuration - using environment variables
# Make sure MySQL is running locally before starting the application
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/chatbot?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8}
spring.datasource.driver-class-name=${MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Logging configuration
logging.level.root=INFO
logging.level.com.example.javaaichatbot=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN