server.port=8080

spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:chatdb}
spring.datasource.driver-class-name=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USERNAME:sa}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

logging.level.root=INFO
logging.level.com.example.javaaichatbot=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN